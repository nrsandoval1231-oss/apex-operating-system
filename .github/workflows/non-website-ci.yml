name: Apex non-Website verification

on:
  # Run it on demand.
  #
  # This workflow is the only place the Designer contract test executes: it
  # checks the private apex-designer repository out beside this one with a
  # read-only deploy key. So the signal is needed exactly when THAT repository
  # changes and this one does not — a new quantity model, a new engine export —
  # and the path filters below correctly decline to fire for that, because
  # nothing in this workspace moved.
  #
  # Without a manual trigger the only way to get the check was to commit
  # something here that nobody wanted, purely to make a build happen.
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'integration-tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/non-website-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'integration-tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/non-website-ci.yml'

permissions:
  contents: read

concurrency:
  group: apex-non-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A real Postgres for the adapter tests. Everything else runs against
    # embedded PGlite; the driver boundary — type parsing, pooled transactions,
    # advisory locks — is the part PGlite cannot cover by construction.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://apex:apex@localhost:5432/apex_test
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: apex-evidence
      S3_ACCESS_KEY_ID: apexkey
      S3_SECRET_ACCESS_KEY: apexsecret123
      S3_REGION: us-east-1
      # The `secrets` context is not available in a step-level `if`, but it is
      # available in a job-level `env`. This carries "is the key configured" —
      # never the key itself — into the two steps that need to branch on it.
      HAS_DESIGNER_KEY: ${{ secrets.APEX_DESIGNER_DEPLOY_KEY != '' }}
      HAS_PROPOSAL_KEY: ${{ secrets.APEX_PROPOSAL_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      # `Apex Designer/` is a separate private repository (ADR-0002) and is
      # gitignored here, so integration-tests/designer-contract.test.ts skips on
      # any clone without it. Checking it out is what gives the contract a CI
      # signal. Source only — the engine imports nothing outside its own tree, so
      # there is no second install.
      #
      # The `if` guard is deliberate: a fork, or this repository before the
      # deploy key is configured, cannot read apex-designer and must not fail on
      # a secret it was never going to have. What stops that guard from becoming
      # a silent hole is APEX_REQUIRE_DESIGNER_CONTRACT below.
      - name: Check out Apex Designer
        if: env.HAS_DESIGNER_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: nrsandoval1231-oss/apex-designer
          path: Apex Designer
          ssh-key: ${{ secrets.APEX_DESIGNER_DEPLOY_KEY }}
          persist-credentials: false

      - name: Note that the Designer contract will not be verified
        if: env.HAS_DESIGNER_KEY != 'true'
        run: |
          echo "::warning title=Designer contract unverified::APEX_DESIGNER_DEPLOY_KEY is not set, so apex-designer was not checked out and the Designer contract test will skip. See docs/runbooks/deployment.md section 8."

      # The Proposal engine, for integration-tests/takeoff-to-proposal.test.ts — the only test
      # that runs the whole chain: Designer measures, the quantities are approved, Proposal
      # prices them, the proposal is issued. It needs BOTH sibling repositories, so it skips
      # unless this key is configured as well as the Designer one.
      #
      # Source only, and no install: the Proposal engine is deliberately dependency-free plain
      # ESM, which is why it can simply be imported.
      - name: Check out the Proposal engine
        if: env.HAS_PROPOSAL_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: nrsandoval1231-oss/apex-proposal-engine
          path: apex-proposal-engine
          ssh-key: ${{ secrets.APEX_PROPOSAL_DEPLOY_KEY }}
          persist-credentials: false

      - name: Note that the takeoff-to-proposal chain will not be verified
        if: env.HAS_PROPOSAL_KEY != 'true' || env.HAS_DESIGNER_KEY != 'true'
        run: |
          echo "::warning title=Chain unverified::The takeoff-to-proposal chain test needs BOTH apex-designer and apex-proposal-engine checked out. Set APEX_PROPOSAL_DEPLOY_KEY (and APEX_DESIGNER_DEPLOY_KEY) as read-only deploy keys to run it; until then it skips, which is not a pass."

      # MinIO speaks the S3 API. Run as a step rather than a service container
      # because the image needs a command (`server /data`), which the services
      # block cannot set.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=apexkey \
            -e MINIO_ROOT_PASSWORD=apexsecret123 \
            minio/minio server /data
          for attempt in $(seq 1 40); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready"; docker logs minio; exit 1

      - name: Create the evidence buckets
        env:
          MC_HOST_ci: http://apexkey:apexsecret123@localhost:9000
        run: |
          # MC_HOST_<alias> rather than `mc alias set`: every `docker run --rm`
          # gets a fresh config, so an alias set in one container is gone in the
          # next. `mc mb` then treats `ci/apex-evidence` as a LOCAL DIRECTORY,
          # creates it inside the throwaway container, prints "Bucket created
          # successfully", and exits 0 — while MinIO never receives a bucket.
          docker run --rm --network host -e MC_HOST_ci minio/mc mb --ignore-existing ci/apex-evidence
          docker run --rm --network host -e MC_HOST_ci minio/mc mb --ignore-existing ci/apex-container
          # Fails the step if the bucket is not really on the server, so this
          # cannot silently succeed again.
          docker run --rm --network host -e MC_HOST_ci minio/mc stat ci/apex-evidence

      # The pnpm version is NOT pinned here. package.json's `packageManager`
      # field already pins it to pnpm@11.18.0, and this action reads it. Naming
      # it in both places is two pins that can disagree — and the one nobody
      # updates is the one in the workflow.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          # Set only when the checkout above actually ran. The test then fails
          # instead of skipping if the engine is missing, so a checkout that
          # lands in the wrong path or a revoked key is red rather than green.
          APEX_REQUIRE_DESIGNER_CONTRACT: ${{ env.HAS_DESIGNER_KEY == 'true' && '1' || '' }}
          # Set only when BOTH checkouts were supposed to happen. The chain test then fails
          # instead of skipping if either engine is missing — the console warning it prints is
          # swallowed by vitest, so this variable is the only thing that makes the skip visible.
          APEX_REQUIRE_TAKEOFF_CHAIN: ${{ (env.HAS_DESIGNER_KEY == 'true' && env.HAS_PROPOSAL_KEY == 'true') && '1' || '' }}
      - run: pnpm audit --prod --audit-level high

      # The container is built AND RUN. A Dockerfile that merely builds proves
      # almost nothing: the failures that matter are a missing runtime file, a
      # wrong working directory, and a process that exits on boot.
      - name: Build the container image
        run: docker build -t apex-os:ci .

      - name: Create the container's database
        run: |
          docker run --rm --network host -e PGPASSWORD=apex postgres:16 \
            psql -h localhost -U apex -d apex_test -c 'create database apex_container'

      - name: Run the container against real dependencies
        run: |
          docker run -d --name apex-os --network host \
            -e PORT=4300 \
            -e DATABASE_URL='postgres://apex:apex@localhost:5432/apex_container' \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_BUCKET=apex-container \
            -e S3_ACCESS_KEY_ID=apexkey \
            -e S3_SECRET_ACCESS_KEY=apexsecret123 \
            -e S3_REGION=us-east-1 \
            -e GATE_JWT_SECRET=container-smoke-test-secret-at-least-32-bytes \
            -e APEX_PUBLIC_ORIGIN=https://apex.example.com \
            apex-os:ci

          for attempt in $(seq 1 45); do
            if curl -sf http://localhost:4300/health > /dev/null; then break; fi
            if [ "$attempt" = "45" ]; then
              echo "Container never became live"; docker logs apex-os; exit 1
            fi
            sleep 2
          done

          # Readiness is the real assertion: it proves the container reached
          # Postgres, ran its migrations under the advisory lock, and reached the
          # bucket. A liveness pass alone would only prove Node started.
          ready=$(curl -sf http://localhost:4300/ready) || {
            echo "Readiness failed"; docker logs apex-os; exit 1; }
          echo "ready: $ready"
          echo "$ready" | grep -q '"database":true' || { docker logs apex-os; exit 1; }
          echo "$ready" | grep -q '"evidence":true' || { docker logs apex-os; exit 1; }

          # The staff app is served from the same origin as the API it calls.
          curl -sf http://localhost:4300/app > /dev/null || {
            echo "Staff app not served"; docker logs apex-os; exit 1; }

          # An unknown customer token must 404 rather than error, and must carry
          # the header that keeps a forwarded link out of search results.
          token=$(printf 'z%.0s' $(seq 1 43))
          headers=$(curl -s -o /dev/null -D - -w '%{http_code}' "http://localhost:4300/c/${token}")
          echo "$headers" | grep -q '404' || { echo "customer 404 missing"; exit 1; }
          echo "$headers" | grep -qi 'x-robots-tag: noindex' || { echo "noindex missing"; exit 1; }

          docker logs apex-os
          docker rm -f apex-os

      - name: Refuse to ship an image that disables authentication
        run: |
          # GATE_LOCAL_USER removes authentication for anything that can reach
          # the server. The image binds 0.0.0.0, so starting with it set must
          # fail rather than quietly serve.
          if docker run --rm --network host \
            -e DATABASE_URL='postgres://apex:apex@localhost:5432/apex_container' \
            -e GATE_JWT_SECRET=container-smoke-test-secret-at-least-32-bytes \
            -e GATE_LOCAL_USER=user_01ARZ3NDEKTSV4RRFFQ69G5FB2 \
            apex-os:ci > /tmp/guard.log 2>&1; then
            echo "Container started with GATE_LOCAL_USER on a public bind"; cat /tmp/guard.log; exit 1
          fi
          grep -qi 'loopback' /tmp/guard.log || { cat /tmp/guard.log; exit 1; }
          echo "Guard held."
