name: Apex non-Website verification

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'integration-tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/non-website-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'integration-tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/non-website-ci.yml'

permissions:
  contents: read

concurrency:
  group: apex-non-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres for the adapter tests. Everything else runs against
    # embedded PGlite; the driver boundary — type parsing, pooled transactions,
    # advisory locks — is the part PGlite cannot cover by construction.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://apex:apex@localhost:5432/apex_test
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: apex-evidence
      S3_ACCESS_KEY_ID: apexkey
      S3_SECRET_ACCESS_KEY: apexsecret123
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      # MinIO speaks the S3 API. Run as a step rather than a service container
      # because the image needs a command (`server /data`), which the services
      # block cannot set.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=apexkey             -e MINIO_ROOT_PASSWORD=apexsecret123             minio/minio server /data
          for attempt in $(seq 1 40); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready"; docker logs minio; exit 1
      - name: Create the evidence bucket
        env:
          MC_HOST_ci: http://apexkey:apexsecret123@localhost:9000
        run: |
          # MC_HOST_<alias> rather than `mc alias set`: every `docker run --rm`
          # gets a fresh config, so an alias set in one container is gone in the
          # next. `mc mb` then treats `ci/apex-evidence` as a LOCAL DIRECTORY,
          # creates it inside the throwaway container, prints "Bucket created
          # successfully", and exits 0 — while MinIO never receives a bucket.
          docker run --rm --network host -e MC_HOST_ci minio/mc mb --ignore-existing ci/apex-evidence
          docker run --rm --network host -e MC_HOST_ci minio/mc ls ci
          # Fails the step if the bucket is not really on the server, so this
          # cannot silently succeed again.
          docker run --rm --network host -e MC_HOST_ci minio/mc stat ci/apex-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm audit --prod --audit-level high
