name: Apex Website verification

# Runs on every push to main and every pull request, with no path filters.
#
# The sibling workflow in the Apex system repository filters by path, because
# that workspace is large and most of it is irrelevant to any one change. This
# repository is the opposite: it is small, the whole suite finishes in a couple
# of minutes, and almost every file in it can break the lead payload. A path
# filter here would buy a few seconds and introduce a way for a change to reach
# main unverified, which is a bad trade.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` rather than `npm install`: installs exactly the lockfile and
      # fails if package.json and the lock have drifted apart. The same
      # discipline as `pnpm install --frozen-lockfile` in the system repository.
      - run: npm ci

      - name: Type and Astro check
        run: npm run check

      - name: Production build
        run: npm run build

      # Both Playwright projects are Chromium — "Desktop Chrome" and an emulated
      # Pixel 7 — so Firefox and WebKit are not downloaded. The version comes
      # from the lockfile, so the browser always matches the @playwright/test
      # that will drive it.
      #
      # Deliberately not cached. The download is ~30s, and a cache keyed on the
      # lockfile is one more thing that can go stale and produce a browser/driver
      # mismatch that reads as a product failure. Not worth it at this size.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # No .env exists in CI, which is the point: the fallbacks in
      # src/lib/site.ts resolve the TEST webhook, and AC-1.7 asserts that a
      # non-production build targets `webhook-test`. Hard rule 6 — no test run
      # may fire real traffic — is therefore itself under test, on top of every
      # spec routing the request to a local mock.
      #
      # playwright.config.ts already adapts to CI on its own: one worker, two
      # retries, `forbidOnly`, the GitHub reporter, and no reuse of an existing
      # dev server.
      - name: Acceptance suite
        run: npm test

      # The report is the only way to see what a flake actually did, and it is
      # worth nothing after the fact if it was not kept.
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # The cutover gate from docs/launch-checklist.md, run against a real
      # production build. It catches the class of mistake that looks completely
      # normal in a browser: shipping `Disallow: /`, still pointing at the test
      # lead webhook, a missing canonical, a duplicate title.
      #
      # `--allow-placeholders` is required here and is NOT how the gate is run at
      # launch. D-20 (real photography) is an open decision waiting on a person,
      # and without the flag preflight fails by design — so CI would be red from
      # its first run for a reason no pull request can fix. A check that is
      # always red is a check everybody learns to ignore, which would cost the
      # nine assertions above it. The launch run is the flagless one, by hand,
      # off the checklist.
      - name: Pre-cutover preflight
        run: |
          PUBLIC_ENV=production npm run build
          npm run preflight -- --allow-placeholders

  # Its own job so the result is legible at a glance rather than buried at the
  # end of the suite, and so it still reports when a test fails.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Blocking, production dependencies only, high and above.
      #
      # This repository sat on 3 high and 1 moderate for months while the audit
      # was tracked as a launch blocker in prose; it is at zero now, and the
      # cheapest way to keep it there is to make regression loud. Dev-only
      # advisories are excluded because they do not ship to a visitor.
      #
      # If this ever goes red on a pull request that did not touch dependencies,
      # a new advisory landed upstream — that is the signal working, not noise.
      # Fix it by upgrading or by an explicit, commented exception. Do not lower
      # the level to make it quiet.
      - run: npm audit --omit=dev --audit-level=high
