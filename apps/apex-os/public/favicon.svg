<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Apex OS">
  <!--
    The apex: a peak above a datum line.

    It is the company's name and the plan sheet's grammar at once — a section
    mark sitting on the drawing's baseline. Two shapes and nothing else, because
    a favicon is read at 16px: the peak survives that, a pool profile or a
    lettermark would not.

    Both strokes are opaque and heavy on purpose. A half-opacity hairline
    disappears completely when this is scaled to 16 pixels, which was checked by
    rasterising it rather than assumed.

    Charcoal ground and sage stroke are the brand's own, per DESIGN.md. No
    gradient, no glow, no third colour.
  -->
  <rect width="32" height="32" rx="6" fill="#1b1c1e"/>
  <path d="M6 19 16 7l10 12"
        fill="none" stroke="#a1ccca" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M6.5 25.5h19" fill="none" stroke="#a1ccca" stroke-width="3"
        stroke-linecap="round"/>
</svg>
