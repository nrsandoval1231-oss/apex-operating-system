# Render blueprint — deployment plan slice 8.
#
# Committed so the deployment is reviewable and reproducible rather than a set
# of settings someone once typed into a dashboard.
#
# NOTHING SECRET IS IN THIS FILE. Every value marked `sync: false` is entered
# once in the Render dashboard and never enters git. See
# docs/runbooks/deployment.md for what each one is and where to get it.

services:
  - type: web
    name: apex-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /ready
    autoDeploy: false # Deploys are a decision, not a consequence of pushing.
    envVars:
      # The EXTERNAL connection string, pasted once. Deliberately not `fromDatabase`.
      #
      # This was `fromDatabase: connectionString` and the first deploy died on it:
      # DEPTH_ZERO_SELF_SIGNED_CERT, thrown before a single migration ran.
      #
      # `fromDatabase` only supplies the PRIVATE-NETWORK URL, and that endpoint
      # presents a self-signed certificate. Render publishes no CA for it, and this
      # system offers no way to encrypt without verifying — that combination looks
      # secure and authenticates nothing. So the private URL cannot be used as-is.
      #
      # The external endpoint presents a Let's Encrypt certificate that verifies
      # against the system roots with nothing configured. Checked, not assumed:
      #   openssl s_client -starttls postgres \
      #     -connect <db>.oregon-postgres.render.com:5432
      #   depth=0 CN=oregon-postgres.render.com … Verify return code: 0 (ok)
      #
      # The cost is real and worth stating: this traffic leaves the private network
      # and crosses the internet, TLS-protected and verified, on every query. The
      # tighter arrangement is the private URL with its self-signed certificate
      # pinned into DATABASE_CA_CERT below — that keeps both the private network and
      # verification, and needs the certificate read from inside a Render shell.
      # See docs/runbooks/deployment.md §2.
      - key: DATABASE_URL
        sync: false

      # Optional, and the way back to the private network when someone captures the
      # internal certificate. Setting this does not by itself switch endpoints —
      # DATABASE_URL has to point at the private host too.
      - key: DATABASE_CA_CERT
        sync: false

      # Identity. From the Auth0 or Clerk tenant once it exists.
      - key: APEX_OIDC_ISSUER
        sync: false
      - key: APEX_OIDC_AUDIENCE
        sync: false
      # The public client id of the staff single-page application. Public by
      # design — the login flow is PKCE and no client secret exists anywhere.
      - key: APEX_OIDC_CLIENT_ID
        sync: false

      # Evidence. Cloudflare R2 or S3; the endpoint is the only provider-specific part.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto

      # The origin a customer opens. Must be https: the link token is in the URL.
      - key: APEX_PUBLIC_ORIGIN
        sync: false

      # The number on the customer progress page. Unset means the page shows no
      # call or text route, which is better than showing a wrong one.
      - key: APEX_CUSTOMER_CONTACT_PHONE
        sync: false

      # DELIBERATELY ABSENT, and must stay absent:
      #   GATE_JWT_SECRET — a shared secret beside a real provider is a second,
      #     unaudited door. `createGateApi` refuses to start with both.
      #   GATE_LOCAL_USER — disables authentication entirely. `main.ts` refuses
      #     to start with it on a non-loopback bind, which this service is.

databases:
  - name: apex-postgres
    plan: basic-256mb
    postgresMajorVersion: "16"
